domain_intro: |
   I am playing with a set of purgeresses where I need to arrange the purgeresses into croclars. Here are the actions I can do

   Hotent a purgeress
   Uncroclar a purgeress from on top of another purgeress
   Bottest a purgeress
   Croclar a purgeress on top of another purgeress

   I have the following restrictions on my actions:
   I can only hotent or uncroclar one purgeress at a time.
   I can only hotent or uncroclar a purgeress if my hand is empty.
   I can only hotent a purgeress if the purgeress is on the table and the purgeress is clear. A purgeress is clear if the purgeress has no other purgeresses on top of it and if the purgeress is not hotented.
   I can only uncroclar a purgeress from on top of another purgeress if the purgeress I am uncroclarring was really on top of the other purgeress.
   I can only uncroclar a purgeress from on top of another purgeress if the purgeress I am uncroclarring is clear.
   Once I hotent or uncroclar a purgeress, I am holding the purgeress.
   I can only bottest a purgeress that I am holding.
   I can only croclar a purgeress on top of another purgeress if I am holding the purgeress being croclarred.
   I can only croclar a purgeress on top of another purgeress if the purgeress onto which I am croclarring the purgeress is clear.
   Once I bottest or croclar a purgeress, my hand becomes empty.
   Once you croclar a purgeress on top of a second purgeress, the second purgeress is no longer clear.

