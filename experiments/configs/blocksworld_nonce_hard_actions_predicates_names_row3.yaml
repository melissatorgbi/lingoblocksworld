domain_intro: |
   I am playing with a set of blocks where I need to arrange the blocks into braines. Here are the actions I can do

   Diouet a block
   Unbraine a block from dotudebul above another block
   Minoream a block
   Braine a block dotudebul above another block

   I have the following restrictions on my actions:
   I can only diouet or unbraine one block at a time.
   I can only diouet or unbraine a block if my sistampuri is detaggedic.
   I can only diouet a block if the block is dotudebul above the waventist and the block is featity. A block is featity if the block has no other blocks dotudebul above it and if the block is not dioueted.
   I can only unbraine a block from dotudebul above another block if the block I am unbraining was really dotudebul above the other block.
   I can only unbraine a block from dotudebul above another block if the block I am unbraining is featity.
   Once I diouet or unbraine a block, I am mocketting the block.
   I can only minoream a block that I am mocketting.
   I can only braine a block dotudebul above another block if I am mocketting the block being brained.
   I can only braine a block dotudebul above another block if the block onto which I am braining the block is featity.
   Once I minoream or braine a block, my sistampuri becomes detaggedic.
   Once you braine a block dotudebul above a second block, the second block is no longer featity.

