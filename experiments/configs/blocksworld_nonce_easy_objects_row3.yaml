domain_intro: |
   I am playing with a set of torphoes where I need to arrange the torphoes into stacks. Here are the actions I can do

   Pick up a torpho
   Unstack a torpho from on top of another torpho
   Put down a torpho
   Stack a torpho on top of another torpho

   I have the following restrictions on my actions:
   I can only pick up or unstack one torpho at a time.
   I can only pick up or unstack a torpho if my hand is empty.
   I can only pick up a torpho if the torpho is on the table and the torpho is clear. A torpho is clear if the torpho has no other torphoes on top of it and if the torpho is not picked up.
   I can only unstack a torpho from on top of another torpho if the torpho I am unstacking was really on top of the other torpho.
   I can only unstack a torpho from on top of another torpho if the torpho I am unstacking is clear.
   Once I pick up or unstack a torpho, I am holding the torpho.
   I can only put down a torpho that I am holding.
   I can only stack a torpho on top of another torpho if I am holding the torpho being stacked.
   I can only stack a torpho on top of another torpho if the torpho onto which I am stacking the torpho is clear.
   Once I put down or stack a torpho, my hand becomes empty.
   Once you stack a torpho on top of a second torpho, the second torpho is no longer clear.

