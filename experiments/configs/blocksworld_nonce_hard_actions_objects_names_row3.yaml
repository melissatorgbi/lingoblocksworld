domain_intro: |
   I am playing with a set of cleadimers where I need to arrange the cleadimers into barnialls. Here are the actions I can do

   Projum a cleadimer
   Unbarniall a cleadimer from on top of another cleadimer
   Dizer a cleadimer
   Barniall a cleadimer on top of another cleadimer

   I have the following restrictions on my actions:
   I can only projum or unbarniall one cleadimer at a time.
   I can only projum or unbarniall a cleadimer if my hand is empty.
   I can only projum a cleadimer if the cleadimer is on the table and the cleadimer is clear. A cleadimer is clear if the cleadimer has no other cleadimers on top of it and if the cleadimer is not projummed.
   I can only unbarniall a cleadimer from on top of another cleadimer if the cleadimer I am unbarnialling was really on top of the other cleadimer.
   I can only unbarniall a cleadimer from on top of another cleadimer if the cleadimer I am unbarnialling is clear.
   Once I projum or unbarniall a cleadimer, I am holding the cleadimer.
   I can only dizer a cleadimer that I am holding.
   I can only barniall a cleadimer on top of another cleadimer if I am holding the cleadimer being barnialled.
   I can only barniall a cleadimer on top of another cleadimer if the cleadimer onto which I am barnialling the cleadimer is clear.
   Once I dizer or barniall a cleadimer, my hand becomes empty.
   Once you barniall a cleadimer on top of a second cleadimer, the second cleadimer is no longer clear.

