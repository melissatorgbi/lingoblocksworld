domain_intro: |
   I am playing with a set of admineboes where I need to arrange the admineboes into manizers. Here are the actions I can do

   Approfity a adminebo
   Unmanizer a adminebo from on top of another adminebo
   Shague a adminebo
   Manizer a adminebo on top of another adminebo

   I have the following restrictions on my actions:
   I can only approfity or unmanizer one adminebo at a time.
   I can only approfity or unmanizer a adminebo if my hand is empty.
   I can only approfity a adminebo if the adminebo is on the table and the adminebo is clear. A adminebo is clear if the adminebo has no other admineboes on top of it and if the adminebo is not approfitied.
   I can only unmanizer a adminebo from on top of another adminebo if the adminebo I am unmanizerring was really on top of the other adminebo.
   I can only unmanizer a adminebo from on top of another adminebo if the adminebo I am unmanizerring is clear.
   Once I approfity or unmanizer a adminebo, I am holding the adminebo.
   I can only shague a adminebo that I am holding.
   I can only manizer a adminebo on top of another adminebo if I am holding the adminebo being manizerred.
   I can only manizer a adminebo on top of another adminebo if the adminebo onto which I am manizerring the adminebo is clear.
   Once I shague or manizer a adminebo, my hand becomes empty.
   Once you manizer a adminebo on top of a second adminebo, the second adminebo is no longer clear.

