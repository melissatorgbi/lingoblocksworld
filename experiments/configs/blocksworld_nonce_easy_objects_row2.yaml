domain_intro: |
   I am playing with a set of consvias where I need to arrange the consvias into stacks. Here are the actions I can do

   Pick up a consvia
   Unstack a consvia from on top of another consvia
   Put down a consvia
   Stack a consvia on top of another consvia

   I have the following restrictions on my actions:
   I can only pick up or unstack one consvia at a time.
   I can only pick up or unstack a consvia if my hand is empty.
   I can only pick up a consvia if the consvia is on the table and the consvia is clear. A consvia is clear if the consvia has no other consvias on top of it and if the consvia is not picked up.
   I can only unstack a consvia from on top of another consvia if the consvia I am unstacking was really on top of the other consvia.
   I can only unstack a consvia from on top of another consvia if the consvia I am unstacking is clear.
   Once I pick up or unstack a consvia, I am holding the consvia.
   I can only put down a consvia that I am holding.
   I can only stack a consvia on top of another consvia if I am holding the consvia being stacked.
   I can only stack a consvia on top of another consvia if the consvia onto which I am stacking the consvia is clear.
   Once I put down or stack a consvia, my hand becomes empty.
   Once you stack a consvia on top of a second consvia, the second consvia is no longer clear.

