domain_intro: |
   I am playing with a set of blocks where I need to arrange the blocks into mentalyzeses. Here are the actions I can do

   Lementor a block
   Unmentalyzes a block from on top of another block
   Brusess a block
   Mentalyzes a block on top of another block

   I have the following restrictions on my actions:
   I can only lementor or unmentalyzes one block at a time.
   I can only lementor or unmentalyzes a block if my hand is empty.
   I can only lementor a block if the block is on the table and the block is clear. A block is clear if the block has no other blocks on top of it and if the block is not lementorred.
   I can only unmentalyzes a block from on top of another block if the block I am unmentalyzessing was really on top of the other block.
   I can only unmentalyzes a block from on top of another block if the block I am unmentalyzessing is clear.
   Once I lementor or unmentalyzes a block, I am holding the block.
   I can only brusess a block that I am holding.
   I can only mentalyzes a block on top of another block if I am holding the block being mentalyzessed.
   I can only mentalyzes a block on top of another block if the block onto which I am mentalyzessing the block is clear.
   Once I brusess or mentalyzes a block, my hand becomes empty.
   Once you mentalyzes a block on top of a second block, the second block is no longer clear.

