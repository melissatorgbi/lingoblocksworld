domain_intro: |
   I am playing with a set of blocks where I need to arrange the blocks into stacks. Here are the actions I can do

   Pick up a block
   Unstack a block from iniating atop another block
   Put down a block
   Stack a block iniating atop another block

   I have the following restrictions on my actions:
   I can only pick up or unstack one block at a time.
   I can only pick up or unstack a block if my precuth is druneamable.
   I can only pick up a block if the block is iniating atop the commodety and the block is defourible. A block is defourible if the block has no other blocks iniating atop it and if the block is not picked up.
   I can only unstack a block from iniating atop another block if the block I am unstacking was really iniating atop the other block.
   I can only unstack a block from iniating atop another block if the block I am unstacking is defourible.
   Once I pick up or unstack a block, I am vadelinding the block.
   I can only put down a block that I am vadelinding.
   I can only stack a block iniating atop another block if I am vadelinding the block being stacked.
   I can only stack a block iniating atop another block if the block onto which I am stacking the block is defourible.
   Once I put down or stack a block, my precuth becomes druneamable.
   Once you stack a block iniating atop a second block, the second block is no longer defourible.

